name: Android APK (Neliel)
on:
  push:
    branches: [feature/android-apk]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          targets: aarch64-linux-android
      - name: Configure Java and Android NDK
        shell: bash
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          sdkmanager --install "ndk;28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Initialize Android project
        run: pnpm exec tauri android init --ci --skip-targets-install --config src-tauri/tauri.android.conf.json
      - name: Build ARM64 debug APK
        run: pnpm exec tauri android build --ci --debug --apk --target aarch64 --config src-tauri/tauri.android.conf.json
      - name: Collect and verify APK
        shell: bash
        run: |
          mkdir -p apk-output
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -exec cp {} apk-output/ \;
          test -n "$(find apk-output -name '*.apk' -print -quit)"
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$signer"
          for apk in apk-output/*.apk; do "$signer" verify --verbose "$apk"; done
      - name: Upload APK for testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Neliel-Android-ARM64
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
