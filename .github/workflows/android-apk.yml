name: Android APK (Neliel)
on:
  push:
    branches: [feature/android-apk]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          targets: aarch64-linux-android
      - name: Configure Java 21
        shell: bash
        run: |
          test -d "$JAVA_HOME_21_X64"
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Install Android SDK tools and accept licenses
        uses: android-actions/setup-android@138b5fb1cf087fdb4c5f3c621466fe304d0cf2e3 # v4.0.3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358'
      - name: Configure Android NDK
        shell: bash
        run: |
          sdkmanager --version
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Expose Tauri CLI to Gradle
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
          export PATH="$GITHUB_WORKSPACE/node_modules/.bin:$PATH"
          cd src-tauri
          pnpm exec tauri --version
      - name: Set monotonically increasing Android build version
        env:
          HAS_SIGNING_KEY: ${{ secrets.NELIEL_SIGNING_BUNDLE != '' }}
        shell: bash
        run: |
          code=$((1000000 + GITHUB_RUN_NUMBER))
          export NELIEL_BUILD_CODE="$code"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p = Path('src-tauri/tauri.android.conf.json')
          config = json.loads(p.read_text())
          config['bundle']['android']['versionCode'] = int(os.environ['NELIEL_BUILD_CODE'])
          p.write_text(json.dumps(config, indent=2) + '\n')
          PY
          echo "VITE_NELIEL_ANDROID_BUILD=$code" >> "$GITHUB_ENV"
          echo "VITE_NELIEL_ANDROID_SIGNED=$HAS_SIGNING_KEY" >> "$GITHUB_ENV"
          echo "NELIEL_BUILD_CODE=$code" >> "$GITHUB_ENV"
      - name: Bundle and verify Neliel VRMA motion pack
        run: python3 scripts/fetch-neliel-animations.py
      - name: Test animation registry
        run: node --test --experimental-strip-types src/lib/stores/animation-library-parser.test.ts
      - name: Initialize Android project
        run: pnpm exec tauri android init --ci --skip-targets-install
      - name: Build ARM64 debug APK
        run: pnpm exec tauri android build --ci --debug --apk --target aarch64
      - name: Collect and verify APK
        shell: bash
        run: |
          mkdir -p apk-output
          find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -exec cp {} apk-output/ \;
          test -n "$(find apk-output -name '*.apk' -print -quit)"
          signer=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)
          test -n "$signer"
          for apk in apk-output/*.apk; do "$signer" verify --verbose "$apk"; done
      - name: Sign permanent Android update
        if: env.VITE_NELIEL_ANDROID_SIGNED == 'true'
        env:
          NELIEL_SIGNING_BUNDLE: ${{ secrets.NELIEL_SIGNING_BUNDLE }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          keydir=$(mktemp -d)
          trap 'rm -rf "$keydir"' EXIT
          export NELIEL_KEY_DIR="$keydir"
          python - <<'PY'
          import base64, json, os
          from pathlib import Path
          bundle = json.loads(os.environ['NELIEL_SIGNING_BUNDLE'])
          p = Path(os.environ['NELIEL_KEY_DIR'])
          (p / 'neliel.p12').write_bytes(base64.b64decode(bundle['keystore'], validate=True))
          (p / 'password').write_text(bundle['password'])
          PY
          unset NELIEL_SIGNING_BUNDLE
          export NELIEL_KEY_PASS="$(cat "$keydir/password")"
          echo "::add-mask::$NELIEL_KEY_PASS"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          apk=$(find apk-output -name '*.apk' -print -quit)
          test -n "$apk"
          mkdir -p signed-output
          "$signer" sign --ks "$keydir/neliel.p12" --ks-type PKCS12 --ks-key-alias neliel --ks-pass env:NELIEL_KEY_PASS --key-pass env:NELIEL_KEY_PASS --out signed-output/Neliel-Android.apk "$apk"
          "$signer" verify --verbose --print-certs signed-output/Neliel-Android.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging signed-output/Neliel-Android.apk | grep -F "versionCode='$NELIEL_BUILD_CODE'"
          sha256sum signed-output/Neliel-Android.apk | awk '{print $1 "  Neliel-Android.apk"}' > signed-output/SHA256SUMS.txt
          rm -f apk-output/*.apk
          cp signed-output/Neliel-Android.apk apk-output/
      - name: Publish signed Android APK as direct download
        if: env.VITE_NELIEL_ANDROID_SIGNED == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="neliel-android-$NELIEL_BUILD_CODE"
          # Never replace an already published build with different bytes.
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release already exists; new builds require a new workflow run."
            exit 0
          fi
          gh release create "$tag" signed-output/Neliel-Android.apk signed-output/SHA256SUMS.txt --target "$GITHUB_SHA" --title "Neliel Android $NELIEL_BUILD_CODE" --notes "Signed Android ARM64 update. Commit $GITHUB_SHA. Install over the previous permanently signed Neliel version." --prerelease
      - name: Upload APK for testing
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Neliel-Android-ARM64
          path: apk-output/*.apk
          if-no-files-found: error
          retention-days: 14
